name: custom:proxmox
version: "1.0.9"
minDynatraceVersion: "1.333"
author:
  name: Goulet

python:
  runtime:
    module: proxmox_extension
    version:
      min: "3.14"
  activation:
    remote:
      path: activationSchema.json

metrics:
  # --- Cluster ---
  - key: custom.proxmox.cluster.nodes.total
    metadata:
      displayName: "Proxmox Cluster Nodes Total"
      unit: Count
  - key: custom.proxmox.cluster.nodes.online
    metadata:
      displayName: "Proxmox Cluster Nodes Online"
      unit: Count

  # --- Node: CPU ---
  - key: custom.proxmox.node.cpu.usage
    metadata:
      displayName: "Proxmox Node CPU Usage"
      unit: Percent
  - key: custom.proxmox.node.cpu.count
    metadata:
      displayName: "Proxmox Node CPU Count"
      unit: Count
  - key: custom.proxmox.node.cpu.sockets
    metadata:
      displayName: "Proxmox Node CPU Sockets"
      unit: Count

  # --- Node: Load Average ---
  - key: custom.proxmox.node.loadavg.1m
    metadata:
      displayName: "Proxmox Node Load Average 1m"
      unit: Count
  - key: custom.proxmox.node.loadavg.5m
    metadata:
      displayName: "Proxmox Node Load Average 5m"
      unit: Count
  - key: custom.proxmox.node.loadavg.15m
    metadata:
      displayName: "Proxmox Node Load Average 15m"
      unit: Count

  # --- Node: Memory ---
  - key: custom.proxmox.node.memory.used
    metadata:
      displayName: "Proxmox Node Memory Used"
      unit: Byte
  - key: custom.proxmox.node.memory.total
    metadata:
      displayName: "Proxmox Node Memory Total"
      unit: Byte
  - key: custom.proxmox.node.memory.free
    metadata:
      displayName: "Proxmox Node Memory Free"
      unit: Byte

  # --- Node: Swap ---
  - key: custom.proxmox.node.swap.used
    metadata:
      displayName: "Proxmox Node Swap Used"
      unit: Byte
  - key: custom.proxmox.node.swap.total
    metadata:
      displayName: "Proxmox Node Swap Total"
      unit: Byte
  - key: custom.proxmox.node.swap.free
    metadata:
      displayName: "Proxmox Node Swap Free"
      unit: Byte

  # --- Node: Root Disk ---
  - key: custom.proxmox.node.disk.used
    metadata:
      displayName: "Proxmox Node Disk Used"
      unit: Byte
  - key: custom.proxmox.node.disk.total
    metadata:
      displayName: "Proxmox Node Disk Total"
      unit: Byte
  - key: custom.proxmox.node.disk.avail
    metadata:
      displayName: "Proxmox Node Disk Available"
      unit: Byte

  # --- Node: Network ---
  - key: custom.proxmox.node.network.in
    metadata:
      displayName: "Proxmox Node Network In"
      unit: BitPerHour
  - key: custom.proxmox.node.network.out
    metadata:
      displayName: "Proxmox Node Network Out"
      unit: BitPerHour

  # --- Node: Uptime / KSM ---
  - key: custom.proxmox.node.uptime
    metadata:
      displayName: "Proxmox Node Uptime"
      unit: Second
  - key: custom.proxmox.node.ksm.shared
    metadata:
      displayName: "Proxmox Node KSM Shared Memory"
      unit: Byte

  # --- Node: Physical Disks ---
  - key: custom.proxmox.node.disk.device.size
    metadata:
      displayName: "Proxmox Node Physical Disk Size"
      unit: Byte
  - key: custom.proxmox.node.disk.device.smart
    metadata:
      displayName: "Proxmox Node Physical Disk SMART Health"
      unit: Count

  # --- VM: Status / CPU ---
  - key: custom.proxmox.vm.status
    metadata:
      displayName: "Proxmox VM Status (1=running)"
      unit: Count
  - key: custom.proxmox.vm.cpu.usage
    metadata:
      displayName: "Proxmox VM CPU Usage"
      unit: Percent
  - key: custom.proxmox.vm.cpu.count
    metadata:
      displayName: "Proxmox VM vCPU Count"
      unit: Count

  # --- VM: Memory ---
  - key: custom.proxmox.vm.memory.used
    metadata:
      displayName: "Proxmox VM Memory Used"
      unit: Byte
  - key: custom.proxmox.vm.memory.total
    metadata:
      displayName: "Proxmox VM Memory Total"
      unit: Byte

  # --- VM: Balloon ---
  - key: custom.proxmox.vm.balloon.current
    metadata:
      displayName: "Proxmox VM Balloon Current Allocated"
      unit: Byte
  - key: custom.proxmox.vm.balloon.target
    metadata:
      displayName: "Proxmox VM Balloon Target Allocated"
      unit: Byte

  # --- VM: Disk ---
  - key: custom.proxmox.vm.disk.read
    metadata:
      displayName: "Proxmox VM Disk Read"
      unit: BytePerHour
  - key: custom.proxmox.vm.disk.write
    metadata:
      displayName: "Proxmox VM Disk Write"
      unit: BytePerHour
  - key: custom.proxmox.vm.disk.size
    metadata:
      displayName: "Proxmox VM Disk Size"
      unit: Byte

  # --- VM: Network / Uptime ---
  - key: custom.proxmox.vm.network.in
    metadata:
      displayName: "Proxmox VM Network In"
      unit: BitPerHour
  - key: custom.proxmox.vm.network.out
    metadata:
      displayName: "Proxmox VM Network Out"
      unit: BitPerHour
  - key: custom.proxmox.vm.uptime
    metadata:
      displayName: "Proxmox VM Uptime"
      unit: Second

  # --- LXC: Status / CPU ---
  - key: custom.proxmox.lxc.status
    metadata:
      displayName: "Proxmox LXC Status (1=running)"
      unit: Count
  - key: custom.proxmox.lxc.cpu.usage
    metadata:
      displayName: "Proxmox LXC CPU Usage"
      unit: Percent
  - key: custom.proxmox.lxc.cpu.count
    metadata:
      displayName: "Proxmox LXC vCPU Count"
      unit: Count

  # --- LXC: Memory ---
  - key: custom.proxmox.lxc.memory.used
    metadata:
      displayName: "Proxmox LXC Memory Used"
      unit: Byte
  - key: custom.proxmox.lxc.memory.total
    metadata:
      displayName: "Proxmox LXC Memory Total"
      unit: Byte

  # --- LXC: Swap ---
  - key: custom.proxmox.lxc.swap.used
    metadata:
      displayName: "Proxmox LXC Swap Used"
      unit: Byte
  - key: custom.proxmox.lxc.swap.total
    metadata:
      displayName: "Proxmox LXC Swap Total"
      unit: Byte

  # --- LXC: Disk ---
  - key: custom.proxmox.lxc.disk.read
    metadata:
      displayName: "Proxmox LXC Disk Read"
      unit: BytePerHour
  - key: custom.proxmox.lxc.disk.write
    metadata:
      displayName: "Proxmox LXC Disk Write"
      unit: BytePerHour
  - key: custom.proxmox.lxc.disk.size
    metadata:
      displayName: "Proxmox LXC Disk Size"
      unit: Byte

  # --- LXC: Network ---
  - key: custom.proxmox.lxc.network.in
    metadata:
      displayName: "Proxmox LXC Network In"
      unit: BitPerHour
  - key: custom.proxmox.lxc.network.out
    metadata:
      displayName: "Proxmox LXC Network Out"
      unit: BitPerHour

  # --- Storage ---
  - key: custom.proxmox.storage.used
    metadata:
      displayName: "Proxmox Storage Used"
      unit: Byte
  - key: custom.proxmox.storage.total
    metadata:
      displayName: "Proxmox Storage Total"
      unit: Byte
  - key: custom.proxmox.storage.avail
    metadata:
      displayName: "Proxmox Storage Available"
      unit: Byte
  - key: custom.proxmox.storage.enabled
    metadata:
      displayName: "Proxmox Storage Enabled (1=yes)"
      unit: Count
  - key: custom.proxmox.storage.active
    metadata:
      displayName: "Proxmox Storage Active (1=yes)"
      unit: Count

topology:
  types:
    - name: proxmox:cluster
      displayName: Proxmox Cluster
      rules:
        - idPattern: "proxmox-cluster-{cluster_name}"
          instanceNamePattern: "{cluster_name}"
          sources:
            - sourceType: Metrics
              condition: "$prefix(custom.proxmox.cluster)"
          attributes:
            - pattern: "{cluster_name}"
              key: cluster_name
              displayName: Cluster Name
    - name: proxmox:node
      displayName: Proxmox Node
      rules:
        - idPattern: "proxmox-node-{node_name}"
          instanceNamePattern: "{node_name}"
          sources:
            - sourceType: Metrics
              condition: "$prefix(custom.proxmox.node)"
          attributes:
            - pattern: "{node_name}"
              key: node_name
              displayName: Node Name
            - pattern: "{cluster_name}"
              key: cluster_name
              displayName: Cluster Name
    - name: proxmox:vm
      displayName: Proxmox VM
      rules:
        - idPattern: "proxmox-vm-{vmid}"
          instanceNamePattern: "{vm_name}"
          sources:
            - sourceType: Metrics
              condition: "$prefix(custom.proxmox.vm)"
          attributes:
            - pattern: "{vmid}"
              key: vmid
              displayName: VM ID
            - pattern: "{vm_name}"
              key: vm_name
              displayName: VM Name
            - pattern: "{node_name}"
              key: node_name
              displayName: Node Name
    - name: proxmox:lxc
      displayName: Proxmox LXC Container
      rules:
        - idPattern: "proxmox-lxc-{vmid}"
          instanceNamePattern: "{lxc_name}"
          sources:
            - sourceType: Metrics
              condition: "$prefix(custom.proxmox.lxc)"
          attributes:
            - pattern: "{vmid}"
              key: vmid
              displayName: Container ID
            - pattern: "{lxc_name}"
              key: lxc_name
              displayName: Container Name
            - pattern: "{node_name}"
              key: node_name
              displayName: Node Name
    - name: proxmox:storage
      displayName: Proxmox Storage
      rules:
        - idPattern: "proxmox-storage-{node_name}-{storage_name}"
          instanceNamePattern: "{storage_name} ({node_name})"
          sources:
            - sourceType: Metrics
              condition: "$prefix(custom.proxmox.storage)"
          attributes:
            - pattern: "{storage_name}"
              key: storage_name
              displayName: Storage Name
            - pattern: "{node_name}"
              key: node_name
              displayName: Node Name

  relationships:
    - typeOfRelation: CHILD_OF
      fromType: proxmox:node
      toType: proxmox:cluster
      sources:
        - sourceType: Metrics
          condition: "$prefix(custom.proxmox.node)"
    - typeOfRelation: RUNS_ON
      fromType: proxmox:vm
      toType: proxmox:node
      sources:
        - sourceType: Metrics
          condition: "$prefix(custom.proxmox.vm)"
    - typeOfRelation: RUNS_ON
      fromType: proxmox:lxc
      toType: proxmox:node
      sources:
        - sourceType: Metrics
          condition: "$prefix(custom.proxmox.lxc)"
    - typeOfRelation: CHILD_OF
      fromType: proxmox:storage
      toType: proxmox:node
      sources:
        - sourceType: Metrics
          condition: "$prefix(custom.proxmox.storage)"

dashboards:
  - path: dashboards/proxmox_overview.json
